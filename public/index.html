 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Memories</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        input,
        textarea,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
        }

        button {
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .memory {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
            border-radius: 10px;
        }

        .memory img {
            display: block;
            width: 100%;
            max-width: 650px;
            margin-top: 15px;
            border-radius: 10px;
        }

        .date {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }

        /* DELETE BUTTON */

        .delete-button {
            background: red;
            color: white;
            margin-top: 15px;
            font-weight: bold;
        }

        .delete-button:hover {
            background: darkred;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>📸 My Memories</h1>

    <input
        id="title"
        type="text"
        placeholder="Memory title"
    >

    <textarea
        id="description"
        placeholder="Write about your memory..."
    ></textarea>

    <input
        id="image"
        type="file"
        accept="image/png, image/jpeg, image/webp"
    >

    <button onclick="addMemory()">
        Add Memory
    </button>


    <h2>Saved Memories</h2>

    <div id="memories">
        Loading memories...
    </div>

</div>


<script>


// LOAD MEMORIES

async function loadMemories() {

    const memoriesDiv =
        document.getElementById("memories");


    try {

        const response =
            await fetch("/memories");


        const memories =
            await response.json();


        memoriesDiv.innerHTML = "";


        if (memories.length === 0) {

            memoriesDiv.innerHTML =
                "<p>No memories yet.</p>";

            return;
        }


        memories.forEach(function(memory) {


            // MEMORY BOX

            const memoryDiv =
                document.createElement("div");

            memoryDiv.className =
                "memory";


            // TITLE

            const title =
                document.createElement("h3");

            title.textContent =
                memory.title;

            memoryDiv.appendChild(title);


            // DESCRIPTION

            const description =
                document.createElement("p");

            description.textContent =
                memory.description;

            memoryDiv.appendChild(description);


            // DATE

            if (memory.created_at) {

                const date =
                    document.createElement("div");

                date.className =
                    "date";

                date.textContent =
                    new Date(
                        memory.created_at
                    ).toLocaleString();

                memoryDiv.appendChild(date);
            }


            // IMAGE

            if (memory.image_url) {

                const image =
                    document.createElement("img");

                image.src =
                    memory.image_url;

                image.alt =
                    "Memory image";

                memoryDiv.appendChild(image);
            }


            // =========================
            // DELETE BUTTON
            // =========================

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "🗑️ Delete";


            deleteButton.onclick =
                async function() {


                    const answer =
                        confirm(
                            "Are you sure you want to delete this memory?"
                        );


                    if (!answer) {

                        return;
                    }


                    try {


                        const deleteResponse =
                            await fetch(
                                "/memories/" + memory.id,
                                {
                                    method: "DELETE"
                                }
                            );


                        if (
                            deleteResponse.ok
                        ) {

                            alert(
                                "Memory deleted!"
                            );


                            loadMemories();


                        } else {

                            const error =
                                await deleteResponse.json();


                            alert(
                                "Could not delete memory: " +
                                (
                                    error.error ||
                                    "Unknown error"
                                )
                            );
                        }


                    } catch (error) {

                        console.error(error);


                        alert(
                            "Could not connect to the server."
                        );
                    }

                };


            // ADD DELETE BUTTON TO MEMORY

            memoryDiv.appendChild(
                deleteButton
            );


            // ADD MEMORY TO PAGE

            memoriesDiv.appendChild(
                memoryDiv
            );

        });


    } catch (error) {

        console.error(error);


        memoriesDiv.innerHTML =
            "<p>Could not load memories.</p>";
    }

}



// ADD MEMORY

async function addMemory() {


    const title =
        document
        .getElementById("title")
        .value
        .trim();


    const description =
        document
        .getElementById("description")
        .value
        .trim();


    const image =
        document
        .getElementById("image")
        .files[0];


    if (
        !title ||
        !description
    ) {

        alert(
            "Please enter a title and description."
        );

        return;
    }


    const formData =
        new FormData();


    formData.append(
        "title",
        title
    );


    formData.append(
        "description",
        description
    );


    if (image) {

        formData.append(
            "image",
            image
        );
    }


    try {


        const response =
            await fetch(
                "/memories",
                {
                    method: "POST",
                    body: formData
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                "Could not save memory: " +
                (
                    result.error ||
                    "Unknown error"
                )
            );

            return;
        }


        alert(
            "Memory saved! 🎉"
        );


        document
            .getElementById("title")
            .value = "";


        document
            .getElementById("description")
            .value = "";


        document
            .getElementById("image")
            .value = "";


        loadMemories();


    } catch (error) {

        console.error(error);


        alert(
            "Could not connect to the server."
        );
    }

}



// LOAD MEMORIES WHEN PAGE OPENS

loadMemories();


</script>

</body>

</html>
